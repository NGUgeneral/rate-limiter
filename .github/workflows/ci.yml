name: Build and Publish Container

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Map Lowercase Repository Path Variable
      run: |
        echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/rate-limiter:latest" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV
    
    - name: Log into GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: $IMAGE_TAG
